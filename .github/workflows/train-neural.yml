name: Train Expert 802 native model

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: Path to an already-present licensed corpus folder in the runner workspace
        required: true
        default: training/corpus
      steps:
        description: Total pretraining steps
        required: true
        default: "10000"
      batch_size:
        description: Batch size for the available GPU
        required: true
        default: "16"

permissions:
  contents: read

jobs:
  train:
    # Requires a separately provisioned GPU runner; GitHub-hosted ubuntu-latest has no training GPU.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated training dependencies
        run: python -m pip install -r training/requirements.txt
      - name: Validate dataset path
        env:
          DATASET_PATH: ${{ inputs.dataset_path }}
        run: test -d "$DATASET_PATH"
      - name: Prepare BPE corpus
        env:
          DATASET_PATH: ${{ inputs.dataset_path }}
        run: python training/prepare_data.py "$DATASET_PATH" --output training/data
      - name: Train from random initialization
        env:
          TRAIN_STEPS: ${{ inputs.steps }}
          TRAIN_BATCH: ${{ inputs.batch_size }}
        run: python training/train.py --data training/data --output training/checkpoints --steps "$TRAIN_STEPS" --batch-size "$TRAIN_BATCH"
      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: expert802-native-checkpoint
          path: training/checkpoints/
          if-no-files-found: error
          retention-days: 7
