name: Train Expert 802 English model

on:
  workflow_dispatch:
  push:
    paths:
      - "knowledge/**"
      - "learning/**"
      - ".github/workflows/train-english.yml"

permissions:
  contents: write

concurrency:
  group: expert802-english-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Train from English corpus
        run: python -m learning.train
      - name: Save trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/language_model.json
          if git diff --cached --quiet; then
            echo "The model artifact has not changed."
          else
            git commit -m "Train Expert 802 English language model"
            git push
          fi
