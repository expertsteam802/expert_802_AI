name: Train Expert 802 English model

on:
  workflow_dispatch:
  push:
    paths:
      - "knowledge/**"
      - "learning/**"
      - ".github/workflows/train-english.yml"

permissions:
  contents: write

concurrency:
  group: expert802-english-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Open English WordNet 2025
        run: |
          curl -L --fail --retry 3 https://en-word.net/static/english-wordnet-2025.zip -o /tmp/wordnet.zip
          mkdir -p /tmp/wordnet
          unzip -q /tmp/wordnet.zip -d /tmp/wordnet
          find /tmp/wordnet -name data.noun -print -quit
      - name: Build the project dictionary from WordNet
        run: |
          WORDNET_DIR="$(dirname "$(find /tmp/wordnet -name data.noun -print -quit)")"
          python -m learning.import_wordnet "$WORDNET_DIR" knowledge/wordnet_dictionary.json
      - name: Train from English corpus
        run: python -m learning.train
      - name: Save dictionary and trained model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/language_model.json knowledge/wordnet_dictionary.json
          if git diff --cached --quiet; then
            echo "The model and dictionary have not changed."
          else
            git commit -m "Import Open English WordNet and train English model"
            git push
          fi
